# AWS credentials for update-apex-ips from OpenBao/Vault via External Secrets Operator.
# The generator reads aws/creds/update-apex-ips (an assumed_role credential) each time the
# ExternalSecret refreshes, and the ExternalSecret renders a shared-credentials file Secret.
# Replace NAMESPACE, the server, the auth mount path and role to match your OpenBao.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: update-apex-ips-eso
  namespace: NAMESPACE
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: update-apex-ips-aws
  namespace: NAMESPACE
spec:
  method: GET
  path: aws/creds/update-apex-ips
  resultType: Data
  provider:
    server: http://bao:8200
    auth:
      kubernetes:
        mountPath: kubernetes
        role: update-apex-ips
        serviceAccountRef:
          name: update-apex-ips-eso
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: update-apex-ips-aws
  namespace: NAMESPACE
spec:
  # Each refresh mints new STS credentials. Keep this at half the role's default_sts_ttl (1h)
  # or less so a run always finds credentials with at least 30 minutes left.
  refreshInterval: 30m
  target:
    name: update-apex-ips-aws
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        credentials: |
          [default]
          aws_access_key_id = {{ .access_key }}
          aws_secret_access_key = {{ .secret_key }}
          aws_session_token = {{ .security_token }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: update-apex-ips-aws
